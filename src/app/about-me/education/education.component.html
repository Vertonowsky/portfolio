<img [ngClass]="{'custom-background': university.customBackground}" src="{{'assets/images/logo/' + university.icon }}" width="60" height="60" loading="lazy" alt="{{ university.title }}">

<div class="info">
  <h3 class="background_light_blue">{{ university.title }} [{{ university.degree }}]</h3>
</div>
<p>{{ university.description }}</p>
<div class="date">
  <p> <i class="fa-regular fa-calendar-days"></i> {{ university.date }}</p>
</div>
