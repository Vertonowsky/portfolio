<img [ngClass]="{'custom-background': scholarship.customBackground}" src="{{'assets/images/logo/' + scholarship.icon }}" alt="{{ scholarship.title }}">

<p class="erasmus">Erasmus+</p>
<div class="info">
  <h3>{{ scholarship.title }}</h3>
</div>
<p>{{ scholarship.description }}</p>
<div class="date">
  <p> <i class="fa-solid fa-globe"></i> {{ scholarship.country }}, {{ scholarship.date }}</p>
</div>
