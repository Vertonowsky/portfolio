<div id="timeline_section" *ngIf="model">
  <h2 class="heading"><i class="fa-solid fa-suitcase"></i> {{ model.title }} </h2>
  <div id="timeline">
    <div class="timeline-block" *ngFor="let job of model.jobs">
      <div class="timeline-img" appScrollAnimation="0.80">
        <div class="pulse"></div>
        <div class="pulse pulse-delay"></div>
        <div class="overlay"></div>
        <img src="{{'assets/images/' + job.icon }}" width="36" height="36" loading="lazy" alt="{{ job.title }}">
      </div>

      <div class="timeline-content" appScrollAnimation="0.80">
        <h2 class="company"><b class="background_light_blue"> <i class="fa-solid fa-cube"></i> {{ job.company }}</b></h2>
          <ul class="promotion-list">
            <li *ngFor="let promo of job.promotions" class="promotion">
              <p class="title">{{ promo.title }} <span *ngIf="promo.current" class="badge-current"> {{ model.currentJobTitle }} </span></p>
              <div class="date">
                <p> <i class="fa-regular fa-calendar-days"></i> {{ promo.date }}</p>
              </div>
            </li>
            <li>
              <p class="title">{{ job.title }} <span *ngIf="job.current" class="badge-current"> {{ model.currentJobTitle }} </span></p>
              <div class="date">
                <p> <i class="fa-regular fa-calendar-days"></i> {{ job.date }}</p>
              </div>
              <ul class="steps">
                <li *ngFor="let step of job.steps">{{ step }}</li>
              </ul>
              <ul class="technologies">
                <li *ngFor="let technology of job.technologies" class="technology_item">{{ technology }}</li>
              </ul>
            </li>
          </ul>
      </div>
    </div>
  </div>
</div>
